# nginx-spa.conf — configuración de nginx dentro del contenedor frontend
#
# El problema de las SPAs con nginx:
#   React Router maneja las rutas en el browser con la History API.
#   Si el usuario está en /quotes y presiona F5, el browser pide
#   GET /quotes a nginx. nginx no tiene un archivo "quotes" — busca
#   en el sistema de archivos y retorna 404.
#
#   La solución: try_files sirve el archivo estático si existe,
#   y si no existe, sirve /index.html. React Router toma el control
#   desde ahí y renderiza la ruta correcta.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip — reduce el tamaño de JS/CSS en ~70%
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre
    # Vite genera nombres como: index-Dh8Kx2mN.js
    # El hash cambia si el contenido cambia → cache busting automático
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
