# nginx/nginx.conf — reverse proxy de producción
#
# En producción nginx es el punto de entrada único.
# Todo el tráfico llega aquí primero:
#
#   browser → nginx :80/:443
#                ├── /api/* → backend:8000
#                └── /*     → frontend:80
#
# Ventajas de tener nginx adelante:
#   - SSL termination: nginx maneja HTTPS, backend habla HTTP simple
#   - Compresión gzip centralizada
#   - Servir archivos estáticos directamente sin pasar por la app
#   - Rate limiting y headers de seguridad en un solo lugar
#   - Logs de acceso unificados

events {
    worker_connections 1024;
}

http {
    # ── Headers de seguridad ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Upstream services ─────────────────────────────────
    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:80;
    }

    # ── Server HTTP → redirige a HTTPS ───────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (para renovar SSL)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Server HTTPS ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name tu-dominio.com;   # CAMBIAR antes de deploy

        ssl_certificate     /etc/nginx/ssl/live/tu-dominio.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/tu-dominio.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 15M;    # para uploads de Excel

        # API → backend FastAPI
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout generoso para procesar Excel grandes
            proxy_read_timeout 120s;
        }

        # Docs de Swagger (solo en debug — en prod no exponer)
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend → React app
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
